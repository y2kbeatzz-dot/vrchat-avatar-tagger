name: Validate desktop app

on:
  pull_request:
    paths:
      - "tag_avatars_qt.py"
      - "tests/test_ui_smoke.py"
      - "tagger_core.py"
      - "tag_avatars_gui.py"
      - "requirements.txt"
      - "scripts/build_icons.py"
      - "scripts/build_installer_art.py"
      - "installer/windows.iss"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "tag_avatars_qt.py"
      - "tagger_core.py"
      - "requirements.txt"

jobs:
  test:
    name: Desktop smoke test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux Qt platform libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt Pillow
      - name: Syntax and import test
        run: python -m compileall -q tag_avatars_qt.py tagger_core.py tag_avatars_gui.py tag_avatars.py scripts
      - name: Test generated installer images
        run: |
          python scripts/build_icons.py
          python scripts/build_installer_art.py
      - name: Verify TLS trust handling without network login
        run: python tests/test_tls.py
      - name: Headless Qt application smoke test
        run: python tests/test_ui_smoke.py
