name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "screenshot.png"
      - "banner.png"
      - "assets/icon.svg"
      - "assets/ui-preview.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html screenshot.png banner.png _site/
          mkdir -p _site/assets
          cp assets/icon.svg assets/ui-preview.svg _site/assets/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
